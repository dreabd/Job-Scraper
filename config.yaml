# ---------------------------------------------------------------------------
# jobwatch config — edit freely. Bad slugs just log a warning and are skipped.
# Find a company's slug from its job board URL:
#   greenhouse: job-boards.greenhouse.io/<slug>   (or boards.greenhouse.io/<slug>)
#   lever:      jobs.lever.co/<slug>
#   ashby:      jobs.ashbyhq.com/<slug>
#   workday:    https://<tenant>.<wdN>.myworkdayjobs.com/<site>
#   oracle:     .../hcmUI/CandidateExperience/en/sites/<site>/...  (host = the *.oraclecloud.com domain)
#   talentbrew: a category/listing page on a Radancy career site (e.g. Kaiser)
# ---------------------------------------------------------------------------

# How far back to look on the first run (after that, "seen" ids prevent repeats).
lookback_hours: 24

# Title must match one of these (case-insensitive regex).
title_include:
  - site reliability
  - \bsre\b
  - production engineer
  - production support
  - production operations
  - application support
  - technical support engineer
  - support engineer
  - devops
  - platform engineer
  - cloud operations
  - cloud engineer
  - infrastructure engineer
  - technical operations
  - tech ops
  - \bkdb\b
  - reliability engineer
  # added 2026-11-18 (adjacent roles that fit your background)
  - trading support
  - trade support
  - market data
  - incident (?:response|manager|management|engineer)
  - escalation engineer
  - product support
  - observability
  - monitoring engineer
  - release engineer
  - build engineer
  - systems administrator
  - linux administrator
  - cloud support
  - dataops
  - noc engineer
  - network operations center

# Title must NOT match any of these.
title_exclude:
  - \bsenior\b
  - \bsr\.?\b
  - \bstaff\b
  - \bprincipal\b
  - \blead\b
  - \bmanager\b
  - \bdirector\b
  - \barchitect\b
  - \bintern\b
  - \bhead of\b
  - \bvp\b
  - \biii\b
  - \biv\b
  - \bsales\b
  - \bsolutions? engineer\b

# On-site/hybrid OK only if location mentions one of these (~50mi of Aliso Viejo).
local_places:
  - aliso viejo
  - irvine
  - costa mesa
  - newport beach
  - lake forest
  - mission viejo
  - laguna
  - san clemente
  - san juan capistrano
  - rancho santa margarita
  - tustin
  - santa ana
  - orange, ca
  - anaheim
  - fullerton
  - brea
  - huntington beach
  - fountain valley
  - garden grove
  - westminster
  - cypress
  - buena park
  - seal beach
  - long beach
  - carlsbad
  - oceanside
  - ontario
  - chino
  - corona
  - riverside
  - orange county

# Favorite companies: you get an alert (email, or ntfy if set up) ONLY when one of these posts a
# matching job. Everything else just shows up on the page. Partial, case-insensitive match on the
# company name, e.g. "Datadog", "Hudson River", "CrowdStrike". Leave empty for no alerts at all.
favorites: []

# Companies to skip entirely (case-insensitive substring of company name).
# Empty = skip nothing. Example: - plaid
skip_companies: []

# Skip specific roles: [company substring, title substring]
# Empty = skip nothing. Example: - [anduril, product operations technical specialist]
skip_roles: []

