name: jobwatch

on:
  schedule:
    # Every 30 min, Mon–Fri, ~6am–8pm Pacific (times are UTC). Minutes 2/32 avoid the
    # top-of-hour rush, when GitHub delays or drops scheduled runs.
    # Backup only: cron-job.org is the main trigger (via the API).
    - cron: "2,32 13-23 * * 1-5"
    - cron: "2,32 0-3 * * 2-6"
  workflow_dispatch: {}   # "Run workflow" button + cron-job.org API calls

permissions:
  contents: write         # commit seen.json + docs/matches.json back
  pages: write            # publish the matches page
  id-token: write         # required by deploy-pages

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site_changed: ${{ steps.save.outputs.site_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so the save step can rebase cleanly
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Scan job boards
        # Optional alerts stay off unless these secrets exist.
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python watch.py
      - name: Save state
        id: save
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add seen.json docs/
          if git diff --cached --quiet -- docs/; then echo "site_changed=false" >> "$GITHUB_OUTPUT";
          else echo "site_changed=true" >> "$GITHUB_OUTPUT"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update jobs"
          # If someone pushed while this run was scanning, rebase on top and retry.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          echo "Could not push after 3 tries"; exit 1

  publish:
    # Republish the page only when matches changed.
    needs: scan
    if: needs.scan.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main       # pick up the commit the scan job just pushed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4