<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Matches</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d23; --muted: #5f6673; --line: #e3e6eb;
    --accent: #2457d6; --accent-soft: #e8eefc;
    --go: #137a3f; --go-soft: #e3f4ea; --warm: #9a5b00; --warm-soft: #fbf0dc;
    --maybe: #5f6673; --maybe-soft: #eef0f3; --flag: #a3262a; --flag-soft: #fbe7e7;
    --new: #2457d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111317; --card: #1a1d23; --text: #e8eaee; --muted: #9aa1ad; --line: #2b2f37;
      --accent: #7ea2ff; --accent-soft: #1e2a45;
      --go: #5fd08f; --go-soft: #16301f; --warm: #f0b55c; --warm-soft: #33270f;
      --maybe: #9aa1ad; --maybe-soft: #23262d; --flag: #ff8a8e; --flag-soft: #3a1c1e;
      --new: #7ea2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  header h1 { font-size: 22px; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 4px; margin: 18px 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { border: 0; background: none; color: var(--muted); padding: 8px 12px; font: inherit; cursor: pointer;
         border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .n { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .controls input, .controls select { font: inherit; padding: 7px 10px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--card); color: var(--text); }
  .controls input { flex: 1 1 200px; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
          margin-bottom: 10px; }
  .card.isnew { border-left: 3px solid var(--new); }
  .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .title { font-size: 16px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .co { color: var(--text); margin-top: 2px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .b { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--maybe-soft); color: var(--maybe); }
  .b.go { background: var(--go-soft); color: var(--go); font-weight: 600; }
  .b.warm { background: var(--warm-soft); color: var(--warm); font-weight: 600; }
  .b.flag { background: var(--flag-soft); color: var(--flag); }
  .b.new { background: var(--accent-soft); color: var(--new); font-weight: 600; }
  .acts { display: flex; gap: 4px; flex-shrink: 0; }
  .acts button { font: inherit; font-size: 12px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
                 background: var(--card); color: var(--muted); cursor: pointer; }
  .acts button.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  @media (max-width: 520px) { .top { flex-direction: column; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job Matches</h1>
    <p id="sub">Loading…</p>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="controls">
    <input id="q" type="search" placeholder="Search title, company, location">
    <select id="verdict">
      <option value="">All verdicts</option><option value="GO">GO</option>
      <option value="warm">Warm channel only</option><option value="MAYBE">Maybe</option>
    </select>
    <select id="where">
      <option value="">Remote + local</option><option value="remote">Remote only</option>
      <option value="local">Local only</option>
    </select>
    <select id="sort">
      <option value="found">Newest found</option><option value="posted">Newest posted</option>
    </select>
  </div>
  <main id="list"></main>
</div>
<script>
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const status = store.get("jw-status", {});          // id -> "saved" | "applied" | "hidden"
const lastVisit = store.get("jw-last-visit", null);  // ISO time of previous visit
store.set("jw-last-visit", new Date().toISOString());
let jobs = [], tab = "new";

const TABS = [["new", "Inbox"], ["saved", "Saved"], ["applied", "Applied"], ["hidden", "Hidden"]];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  if (m < 48 * 60) return Math.round(m / 60) + "h ago";
  return Math.round(m / 1440) + "d ago";
}
const bucket = j => status[j.id] || "new";
const isNew = j => lastVisit && j.found > lastVisit;

function render() {
  const counts = {new: 0, saved: 0, applied: 0, hidden: 0};
  jobs.forEach(j => counts[bucket(j)]++);
  $("tabs").innerHTML = TABS.map(([k, label]) =>
    `<button class="tab ${k === tab ? "on" : ""}" data-tab="${k}">${label}<span class="n">${counts[k]}</span></button>`).join("");

  const q = $("q").value.trim().toLowerCase(), v = $("verdict").value, w = $("where").value;
  let rows = jobs.filter(j => bucket(j) === tab)
    .filter(j => !q || `${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q))
    .filter(j => !v || (v === "GO" ? j.verdict === "GO" : v === "warm" ? j.verdict.includes("warm") : j.verdict.startsWith("MAYBE")))
    .filter(j => !w || (w === "remote" ? j.remote : !j.remote));
  const key = $("sort").value;
  rows.sort((a, b) => String(b[key] || "").localeCompare(String(a[key] || "")));

  $("list").innerHTML = rows.length ? rows.map(j => {
    const vcls = j.verdict === "GO" ? "go" : j.verdict.includes("warm") ? "warm" : "";
    const st = status[j.id];
    return `<article class="card ${isNew(j) ? "isnew" : ""}">
      <div class="top">
        <div>
          <a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
          <div class="co">${esc(j.company)} · ${esc(j.location || "Location not listed")}</div>
        </div>
        <div class="acts">
          <button data-id="${esc(j.id)}" data-s="saved" class="${st === "saved" ? "on" : ""}">Save</button>
          <button data-id="${esc(j.id)}" data-s="applied" class="${st === "applied" ? "on" : ""}">Applied</button>
          <button data-id="${esc(j.id)}" data-s="hidden" class="${st === "hidden" ? "on" : ""}">Hide</button>
        </div>
      </div>
      <div class="badges">
        ${isNew(j) ? '<span class="b new">New</span>' : ""}
        <span class="b ${vcls}">${esc(j.verdict)}</span>
        ${j.years != null ? `<span class="b">${j.years}+ yrs</span>` : ""}
        ${j.salary ? `<span class="b">${esc(j.salary)}</span>` : ""}
        ${(j.flags || []).map(f => `<span class="b flag">${esc(f)}</span>`).join("")}
      </div>
      <div class="meta">${j.posted ? "Posted " + ago(j.posted) + " · " : ""}Found ${ago(j.found)}</div>
    </article>`;
  }).join("") : `<p class="empty">${tab === "new" ? "No matches here yet. New ones show up after each scan." : "Nothing here."}</p>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.dataset.tab; render(); return; }
  const b = e.target.closest("button[data-s]");
  if (b) {
    const id = b.dataset.id;
    status[id] = status[id] === b.dataset.s ? undefined : b.dataset.s;
    if (!status[id]) delete status[id];
    store.set("jw-status", status); render();
  }
});
["q", "verdict", "where", "sort"].forEach(id => $(id).addEventListener("input", render));

fetch("matches.json?t=" + Date.now()).then(r => r.ok ? r.json() : {jobs: []}).catch(() => ({jobs: []}))
  .then(d => {
    jobs = d.jobs || [];
    const fresh = lastVisit ? jobs.filter(isNew).length : 0;
    $("sub").textContent = `${jobs.length} matches from the last 45 days` +
      (lastVisit ? ` · ${fresh} new since your last visit` : "") +
      (d.updated ? ` · last new match ${ago(d.updated)}` : "");
    render();
  });
</script>
</body>
</html>
